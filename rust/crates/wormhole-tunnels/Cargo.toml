[package]
name = "wormhole-tunnels"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TunnelManager: ref-counted leases, coalesce, all tunnel-kind sidecar control planes + physical network path Fake glue (mirrors Services/Tunneling)."
publish = false

[lib]
name = "wormhole_tunnels"
path = "src/lib.rs"

[[bin]]
name = "fake-tunnel-sidecar"
path = "src/bin/fake_tunnel_sidecar.rs"
# Test-only stand-in for READY-line handshake coverage (not shipped with the app).
required-features = []

[features]
default = ["domain", "secrets"]
# Prefer workspace `wormhole-domain` for TunnelKind; disable if that crate is absent.
domain = ["dep:wormhole-domain"]
# DPAPI cache reads/writes for WatchGuard / Stormshield / Azure (paths + tunnel-id entropy).
secrets = ["dep:wormhole-secrets-win"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
idna = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "process", "io-util", "net"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["std"] }
wormhole-domain = { workspace = true, optional = true }
wormhole-secrets-win = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Live `GetAdaptersAddresses` / `GetBestInterfaceEx` enumeration for the physical-path probe.
# The workspace root already enables `Win32_NetworkManagement_IpHelper`; the IpHelper
# `IP_ADAPTER_ADDRESSES_LH` struct and `GetBestInterfaceEx` also need the Ndis + WinSock modules.
windows = { workspace = true, features = [
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net"] }
uuid = { workspace = true, features = ["v4", "std"] }
