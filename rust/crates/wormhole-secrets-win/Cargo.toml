[package]
name = "wormhole-secrets-win"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows Credential Manager + DPAPI secrets for Wormhole (CredMgr / keys / tunnels / Bitwarden catalog Fake glue)."
publish = false

[lib]
name = "wormhole_secrets_win"
path = "src/lib.rs"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
pbkdf2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
wormhole-domain = { workspace = true }
# pbkdf2 0.12 needs digest 0.10; workspace sha2 0.11 is for update verify only.
sha2 = { version = "=0.10.9", default-features = false }
uuid = { workspace = true, features = ["v4"] }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
