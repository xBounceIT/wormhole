name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]
        configuration: [Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Wormhole
        run: dotnet restore Wormhole.csproj -p:Platform=${{ matrix.platform }}

      - name: Build Wormhole
        run: dotnet build Wormhole.csproj -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} --no-restore

      - name: Restore tests
        run: dotnet restore Wormhole.Tests/Wormhole.Tests.csproj

      - name: Run tests
        run: dotnet test Wormhole.Tests/Wormhole.Tests.csproj -c ${{ matrix.configuration }} --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.configuration }}
          path: Wormhole.Tests/TestResults/*.trx
          if-no-files-found: ignore

  format:
    name: Format check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # -p:Platform=x64 is required so the Wormhole.csproj WinUI 3 / win-x64 project
      # actually restores. Without it `dotnet restore Wormhole.sln` silently skips the
      # main project (its <Platforms>x64;arm64</Platforms> has no AnyCPU mapping), so the
      # subsequent `dotnet format` workspace load fails with CS0246 on every package type
      # (Serilog/Dapper/SSH.NET/WinUI). The test project is AnyCPU and restores either way.
      - name: Restore Wormhole solution
        run: dotnet restore Wormhole.sln -p:Platform=x64

      - name: Verify formatting
        run: dotnet format Wormhole.sln --verify-no-changes --severity warn --no-restore

  vpn-integration:
    # End-to-end VPN tunnel test: builds the Go sidecars on Linux, stands up real
    # WireGuard and OpenVPN servers in docker-compose, then runs xUnit tests that
    # drive the sidecars and verify a 4-byte SOCKS5 echo round-trip through each
    # tunnel. Catches regressions in:
    #   - the Go sidecar source (wormhole-{wg,ovpn}proxy)
    #   - the stdin JSON / READY <port> wire protocol
    #   - the .NET ProcessHost handshake
    #   - the .NET Socks5Client
    # Independent of the Windows `build` and `format` jobs — a failure here does
    # NOT block a green build matrix, since the Windows-only WinUI path is
    # untouched.
    name: VPN tunnel integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required for the -tags ovpn3 OpenVPN sidecar build — the shim links
          # against tools/wormhole-ovpnproxy/third_party/{openvpn3,mbedtls}.
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/wormhole-wgproxy/go.mod
          cache: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux build prerequisites
        # Native deps for the OpenVPN shim (apt is dramatically faster than vcpkg
        # from scratch). wireguard-tools is for bootstrap.sh's wg/wg pubkey calls;
        # socat would be needed if we wanted to drive the echo target from the
        # host but the docker socat container handles that already.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ cmake pkg-config \
            libasio-dev libjsoncpp-dev liblz4-dev libxxhash-dev \
            wireguard-tools

      - name: Build wormhole-wgproxy
        run: |
          mkdir -p bin
          ( cd tools/wormhole-wgproxy && go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/bin/wormhole-wgproxy" . )
          ls -la bin/wormhole-wgproxy

      - name: Build & unit-test wormhole-ciscoproxy
        # The Cisco AnyConnect sidecar is pure Go (no CGO / submodules), so it builds fast and its
        # unit tests (CSTP framing, aggregate-auth form mapping, debug-log redaction) run here to
        # guard the auth/data-plane logic. No docker fixture yet, so it has no e2e leg below.
        run: |
          ( cd tools/wormhole-ciscoproxy && go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/bin/wormhole-ciscoproxy" . )
          ( cd tools/wormhole-ciscoproxy && go test ./... )
          ls -la bin/wormhole-ciscoproxy

      - name: Build wormhole-ovpnproxy (ovpn3-linked, best-effort)
        # The ovpn_shim CMakeLists targets Windows / MinGW today (tap-windows,
        # _WIN32_WINNT, big-obj). The OpenVPN3 core itself is cross-platform, so
        # this MAY build on Linux out of the box; if it doesn't, the OpenVPN
        # integration test skips with a clear "configure WORMHOLE_OVPNPROXY_PATH"
        # message and the WireGuard half of the job still runs. Worth attempting
        # rather than defaulting to mock-only — a Linux shim build is the right
        # north star.
        #
        # A separate step below emits a ::warning:: when this fails so the
        # OpenVPN-not-exercised state surfaces on the run summary rather than
        # silently skipping forever.
        id: build_ovpn
        continue-on-error: true
        run: |
          set -e
          SHIM_DIR=tools/wormhole-ovpnproxy/ovpn_shim
          # Apply the vendored OpenVPN3 patches before building — they are
          # load-bearing for the data path (see the patch step in
          # scripts/Fetch-OvpnProxy.ps1 for the full rationale). Notably
          # 0001 restores CA-only server-cert verification under mbedTLS 3.6;
          # without it the handshake against the fixture server (remote
          # 127.0.0.1, cert CN from easyrsa) fails hostname verification.
          # Same idempotent skip-if-reverse-applies logic as the script.
          for p in tools/wormhole-ovpnproxy/patches/*.patch; do
            if git -C tools/wormhole-ovpnproxy/third_party/openvpn3 apply --reverse --check "$GITHUB_WORKSPACE/$p" 2>/dev/null; then
              echo "patch already applied: $p"
            else
              git -C tools/wormhole-ovpnproxy/third_party/openvpn3 apply "$GITHUB_WORKSPACE/$p"
              echo "patch applied: $p"
            fi
          done
          cmake -B "$SHIM_DIR/build" -S "$SHIM_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$SHIM_DIR/build" --config Release -j
          export CGO_ENABLED=1
          export CGO_CFLAGS="-I$GITHUB_WORKSPACE/$SHIM_DIR"
          # libovpn_shim.a has unresolved external references to mbedTLS / JsonCpp /
          # lz4 / xxhash (pulled in via OpenVPN3's add_core_dependencies +
          # add_json_library macros). libovpn_shim.a is a thin archive of just
          # shim.cc + ovpncli.cpp — the transitive closure has to be spelled out
          # here, exactly like the Windows `#cgo LDFLAGS` block in ovpn_cgo.go.
          # mbedTLS comes from the submodule built into the shim's build tree
          # (third_party_mbedtls/library); single-pass ld needs dependents before
          # dependencies, so the three mbed libs sit after -lovpn_shim and in
          # tls → x509 → crypto order. asio is header-only so doesn't need
          # linking. -ldl is required by mbedTLS's dynamic loader path.
          # -lstdc++ -lpthread cover the C++ runtime + threading used by the
          # shim itself.
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/$SHIM_DIR/build -L$GITHUB_WORKSPACE/$SHIM_DIR/build/third_party_mbedtls/library -lovpn_shim -lmbedtls -lmbedx509 -lmbedcrypto -ljsoncpp -llz4 -lxxhash -ldl -lstdc++ -lpthread"
          ( cd tools/wormhole-ovpnproxy && go build -trimpath -tags ovpn3 -ldflags "-s -w" -o "$GITHUB_WORKSPACE/bin/wormhole-ovpnproxy" . )
          ls -la bin/wormhole-ovpnproxy

      - name: Warn if ovpn3 build failed
        # Surfaces a yellow ::warning:: on the run summary so a silently-skipped
        # OpenVPN test doesn't masquerade as green coverage forever. Pairs with
        # the continue-on-error: true above.
        if: steps.build_ovpn.outcome != 'success'
        run: |
          echo "::warning::wormhole-ovpnproxy (-tags ovpn3) build failed — OpenVPN integration test will skip. Check the 'Build wormhole-ovpnproxy' step log."

      - name: Bootstrap VPN fixtures
        run: |
          chmod +x tests/vpn-fixtures/bootstrap.sh
          tests/vpn-fixtures/bootstrap.sh

      - name: Bring up VPN servers (docker compose)
        # `up -d --wait` is the canonical "block until every service is healthy
        # OR running (no healthcheck)" gate; --wait-timeout 90 accommodates
        # linuxserver/wireguard's first-run config-permissions pass and the
        # OpenVPN server's TLS init. A non-zero exit here fails the job loudly
        # before the test step gets a chance to produce a misleading tunnel
        # regression against dead infra.
        #
        # NOTE: `docker compose wait` is NOT the right primitive here — it
        # blocks until containers EXIT, not until they reach the healthy state.
        #
        # HOST_UID/HOST_GID feed PUID/PGID in the wireguard service so the
        # s6 init's chown of /config stays on the runner's invoker uid rather
        # than the image default (1000), keeping bootstrap re-runs unblocked.
        run: |
          export HOST_UID=$(id -u)
          export HOST_GID=$(id -g)
          docker compose -f tests/vpn-fixtures/docker-compose.yml up -d --wait --wait-timeout 90
          docker compose -f tests/vpn-fixtures/docker-compose.yml ps

      - name: Run VPN integration tests
        env:
          WORMHOLE_WGPROXY_PATH: ${{ github.workspace }}/bin/wormhole-wgproxy
          WORMHOLE_WG_CLIENT_CONFIG: ${{ github.workspace }}/tests/vpn-fixtures/.out/wireguard/client.json
          WORMHOLE_OPENVPN_CLIENT_PROFILE: ${{ github.workspace }}/tests/vpn-fixtures/.out/openvpn/client.ovpn
          # OvpnProxyPath is set only when the ovpn3-linked build succeeded; the
          # test SkippableFact short-circuits cleanly when it's missing.
          WORMHOLE_OVPNPROXY_PATH: ${{ steps.build_ovpn.outcome == 'success' && format('{0}/bin/wormhole-ovpnproxy', github.workspace) || '' }}
        run: |
          dotnet test Wormhole.Tests.Integration/Wormhole.Tests.Integration.csproj \
            -c Debug \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed"

      - name: Collect docker compose logs (on failure)
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -f tests/vpn-fixtures/docker-compose.yml logs --no-color > artifacts/compose.log || true
          docker compose -f tests/vpn-fixtures/docker-compose.yml ps > artifacts/compose-ps.log || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-integration-results
          path: |
            Wormhole.Tests.Integration/TestResults/*.trx
            artifacts/*.log
          if-no-files-found: ignore

      - name: Tear down VPN servers
        if: always()
        # Export HOST_UID/HOST_GID so compose doesn't emit
        # `WARN[0000] The "HOST_UID" variable is not set` lines during
        # teardown — pure log hygiene, no functional impact.
        run: |
          export HOST_UID=$(id -u)
          export HOST_GID=$(id -g)
          docker compose -f tests/vpn-fixtures/docker-compose.yml down --volumes --remove-orphans
