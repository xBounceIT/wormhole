name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-backend-contract:
    name: Linux credential storage contract
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/wormhole-backend/go.mod
          cache: false

      - name: Test Linux credential storage adapter
        working-directory: tools/wormhole-backend
        run: >-
          go test -run
          '^(TestCredentialSecretKeyringRoundTrip|TestCredentialSecretKeyringErrorsDoNotExposePassword|TestLinuxCredentialSecretRoundTripUsesDBusKeyring|TestMcpTokenLifecycleUsesLinuxSecretService)$'
          ./...

  verify:
    name: Electron, Go, and RDP helper
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/wormhole-backend/go.mod
          cache: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check RDP helper formatting
        shell: pwsh
        run: |
          dotnet format tools/wormhole-rdp-host/Wormhole.RdpHost.csproj --verify-no-changes --severity warn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format tools/wormhole-rdp-host/Tests/Wormhole.RdpHost.Tests.csproj --verify-no-changes --severity warn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Electron, backend, and sidecars
        run: npm run test:electron

      - name: Enforce 80% unit and backend coverage
        run: npm run test:coverage

      - name: Build application
        run: npm run build

      - name: Build Windows RDP helper (x64 and arm64)
        run: npm run build:rdp-host && npm run build:rdp-host:arm64
