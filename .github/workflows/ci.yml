name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Electron, Go, and RDP helper
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/wormhole-backend/go.mod
          cache: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check RDP helper formatting
        shell: pwsh
        run: |
          dotnet format tools/wormhole-rdp-host/Wormhole.RdpHost.csproj --verify-no-changes --severity warn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format tools/wormhole-rdp-host/Tests/Wormhole.RdpHost.Tests.csproj --verify-no-changes --severity warn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Electron, backend, and sidecars
        run: npm run test:electron

      - name: Enforce 80% unit and backend coverage
        run: npm run test:coverage

      - name: Build application
        run: npm run build

      - name: Build Windows RDP helper (x64 and arm64)
        run: npm run build:rdp-host && npm run build:rdp-host:arm64
