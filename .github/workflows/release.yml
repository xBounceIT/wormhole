name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # The real (-tags ovpn3) OpenVPN sidecar links against the openvpn3 + mbedtls
          # submodules. Fetch them on x64 (the arch we build the real sidecar for); arm64
          # intentionally ships the mock-only stub for now, so skip the submodule clone there.
          submodules: ${{ matrix.platform == 'x64' && 'recursive' || '' }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Go
        # Go builds both userspace sidecars (wgproxy + ovpnproxy). Pin it explicitly rather
        # than relying on whatever the runner image happens to preinstall.
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/wormhole-ovpnproxy/go.mod
          cache: false

      - name: Set up OpenVPN3 sidecar toolchain (x64)
        # Fetch-OvpnProxy.ps1 builds the real `-tags ovpn3` binary only when a MinGW C++
        # toolchain + CMake are reachable and vcpkg can supply asio/jsoncpp/lz4/xxhash.
        # CMake ships on windows-latest; install MinGW-w64 (gcc/g++/mingw32-make — CGO on
        # Windows uses gcc, NOT MSVC) and point the script at the runner's preinstalled
        # vcpkg via VCPKG_ROOT so it resolves the x64-mingw-static deps from
        # ovpn_shim/vcpkg.json. The script hydrates PATH/VCPKG_ROOT from the registry, so
        # the choco-installed MinGW and this VCPKG_ROOT are picked up by the publish step's
        # child PowerShell even though choco only updates the machine PATH registry.
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:INPUT_TAG
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish (Release / win-${{ matrix.platform }})
        run: >
          dotnet publish Wormhole.csproj
          -c Release
          -r win-${{ matrix.platform }}
          -p:Platform=${{ matrix.platform }}
          --self-contained true
          -o artifacts/publish/win-${{ matrix.platform }}

      - name: Verify real OpenVPN sidecar shipped (x64)
        # Hard gate so we never silently ship the mock-only stub again (the v0.2.4 bug). The
        # stub fatals with "OpenVPN3 binding not linked" on any real-mode connect; the real
        # ovpn3 build instead fails a bogus profile with an OpenVPN parse error. Drive one
        # real-mode config through stdin and assert the stub's signature string is absent.
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $exe = "$PWD\artifacts\publish\win-x64\wormhole-ovpnproxy.exe"
          if (-not (Test-Path $exe)) {
            throw "wormhole-ovpnproxy.exe is missing from the publish output — Fetch-OvpnProxy.ps1 produced nothing. Check the 'Set up OpenVPN3 sidecar toolchain' step."
          }
          $cfg = '{"profile_ovpn":"remote 203.0.113.1 1194\ndev tun\n","mock":false}'
          $out = ($cfg | & $exe 2>&1 | Out-String)
          # The sidecar exits non-zero on the bogus profile; that's expected, so don't let the
          # runner's pwsh epilogue ("exit $LASTEXITCODE") fail the step on it.
          $global:LASTEXITCODE = 0
          if ($out -match 'binding not linked') {
            throw "Shipped wormhole-ovpnproxy.exe is the MOCK-ONLY stub — the '-tags ovpn3' build did not run. Sidecar stderr: $out"
          }
          Write-Host "OK: real ovpn3 OpenVPN sidecar verified (no 'binding not linked'). Sidecar stderr: $out"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $iscc      = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $publish   = "$PWD\artifacts\publish\win-$env:PLATFORM"
          $outputDir = "$PWD\installer\output"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at '$iscc'. Inno Setup 6 install did not land where expected — check the 'Install Inno Setup' step."
          }
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $iscc `
            "/DAppArchitecture=$env:PLATFORM" `
            "/DPublishDir=$publish" `
            "/DMyAppVersion=$env:VERSION" `
            "/O$outputDir" `
            installer\Wormhole.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          # Flatten EXE to workspace root so upload-artifact stores it at the
          # same depth as the zip — otherwise the artifact preserves
          # 'installer/output/' and the release job's glob can't find it.
          Move-Item "$outputDir\Wormhole-*-setup.exe" .

      - name: Package zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $zip = "Wormhole-$env:VERSION-win-$env:PLATFORM.zip"
          Compress-Archive -Path "artifacts/publish/win-$env:PLATFORM/*" -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-win-${{ matrix.platform }}
          path: |
            Wormhole-*.zip
            Wormhole-*-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          printf 'tag=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/Wormhole-*.zip \
            artifacts/Wormhole-*-setup.exe
