name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) { throw new Error('Release tag ' + process.env.RELEASE_TAG + ' does not match ' + expected); }"

  build:
    name: Build Electron ${{ matrix.platform }}
    needs: checks
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/wormhole-ovpnproxy/go.mod
          cache: false

      - name: Set up OpenVPN3 sidecar toolchain (x64)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up OpenVPN3 sidecar cross-toolchain (arm64)
        if: matrix.platform == 'arm64'
        shell: pwsh
        run: |
          $version = "20260602"
          $archive = "$env:RUNNER_TEMP\llvm-mingw.zip"
          $destination = "$env:RUNNER_TEMP\llvm-mingw"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-x86_64.zip"
          $expectedSha256 = "3de3eda9377bbaf35f8c9001f190380f63b8ee981fa55d3ae9d7cce7c6ad7c70"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "llvm-mingw SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $toolchain = Get-ChildItem -LiteralPath $destination -Directory | Select-Object -First 1
          if (-not $toolchain) { throw "llvm-mingw archive did not contain a toolchain directory" }
          $bin = Join-Path $toolchain.FullName "bin"
          if (-not (Test-Path (Join-Path $bin "aarch64-w64-mingw32-clang.exe"))) {
            throw "llvm-mingw archive is missing the aarch64 cross compiler"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WORMHOLE_OVPN_CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:INPUT_TAG
          $version = $tag -replace '^v', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Electron runtime for ${{ matrix.platform }}
        shell: pwsh
        run: |
          if ("${{ matrix.platform }}" -eq "arm64") {
            $env:npm_config_arch = 'arm64'
            $env:npm_config_platform = 'win32'
          }
          node node_modules/electron/install.js

      - name: Build renderer and Electron main
        run: npm run build:renderer && npm run build:electron

      - name: Build real VPN sidecars
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          & scripts\Build-ElectronVpnSidecars.ps1 -Arch $env:PLATFORM -RequireRealOvpn
          if ($LASTEXITCODE -ne 0) { throw "VPN sidecar build failed with exit $LASTEXITCODE" }

      - name: Build Go backend for ${{ matrix.platform }}
        run: node scripts/Build-ElectronBackend.mjs --arch ${{ matrix.platform }}

      - name: Build native helpers
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          & scripts\Build-CredentialReader.ps1 -Arch $env:PLATFORM
          if ($LASTEXITCODE -ne 0) { throw "Credential reader build failed with exit $LASTEXITCODE" }
          & scripts\Build-RdpHost.ps1 -Arch $env:PLATFORM
          if ($LASTEXITCODE -ne 0) { throw "RDP host build failed with exit $LASTEXITCODE" }

      - name: Verify real OpenVPN sidecar shipped
        shell: pwsh
        run: |
          $platform = "${{ matrix.platform }}"
          $exe = "$PWD\dist-electron\wormhole-ovpnproxy.exe"
          if (-not (Test-Path $exe)) {
            throw "wormhole-ovpnproxy.exe is missing from dist-electron."
          }
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if ($ascii -match 'binding not linked') {
            throw "Shipped wormhole-ovpnproxy.exe is the mock-only stub."
          }
          if ($platform -eq "x64") {
            $cfg = '{"profile_ovpn":"remote 203.0.113.1 1194\ndev tun\n","mock":false}'
            $out = ($cfg | & $exe 2>&1 | Out-String)
            $global:LASTEXITCODE = 0
            if ($out -match 'binding not linked') {
              throw "Shipped x64 sidecar is mock-only. Sidecar stderr: $out"
            }
          }
          Write-Host "OK: real ovpn3 OpenVPN sidecar verified for $platform."

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Electron installer
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          & scripts\Build-ElectronInstaller.ps1 -Architecture $env:PLATFORM -AppVersion $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "Electron installer build failed with exit $LASTEXITCODE" }
          Move-Item "installer\output\Wormhole-*-setup.exe" .

      - name: Generate SHA-256 sidecars
        shell: pwsh
        run: |
          Get-ChildItem "Wormhole-*-setup.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.Name).sha256" -Encoding ascii
          }

      - name: Package zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $zip = "Wormhole-$env:VERSION-win-$env:PLATFORM.zip"
          Compress-Archive -Path "artifacts/electron-app/$env:PLATFORM/Wormhole/*" -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wormhole-win-${{ matrix.platform }}
          path: |
            Wormhole-*.zip
            Wormhole-*-setup.exe
            Wormhole-*.sha256
          if-no-files-found: error

  packages:
    name: Build ${{ matrix.platform }} packages
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            builder_platform: linux
            builder_arch: x64
            backend_arch: x64
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
          - platform: linux-arm64
            runner: ubuntu-24.04
            builder_platform: linux
            builder_arch: arm64
            backend_arch: arm64
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
          - platform: macos
            runner: macos-26
            builder_platform: mac
            builder_arch: universal
            backend_arch: universal
            artifacts: release/Wormhole-*-mac-universal-setup.dmg

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/wormhole-backend/go.mod
          cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Build renderer and Electron main
        run: npm run build:renderer && npm run build:electron

      - name: Build native Go components
        if: matrix.backend_arch != 'universal'
        run: node scripts/Build-ElectronBackend.mjs --arch ${{ matrix.backend_arch }}

      - name: Build universal macOS Go components
        if: matrix.backend_arch == 'universal'
        run: npm run build:backend:universal

      - name: Build ${{ matrix.platform }} packages
        run: npm run package -- --${{ matrix.builder_platform }} --${{ matrix.builder_arch }}

      - name: Verify Linux package outputs
        if: matrix.builder_platform == 'linux'
        shell: bash
        env:
          BUILDER_ARCH: ${{ matrix.builder_arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          case "$BUILDER_ARCH" in
            x64)
              expected=(
                'release/Wormhole-*-linux-x86_64.AppImage'
                'release/Wormhole-*-linux-amd64.deb'
                'release/Wormhole-*-linux-x86_64.rpm'
              )
              ;;
            arm64)
              expected=(
                'release/Wormhole-*-linux-arm64.AppImage'
                'release/Wormhole-*-linux-arm64.deb'
                'release/Wormhole-*-linux-aarch64.rpm'
              )
              ;;
            *)
              echo "Unsupported Linux package architecture: $BUILDER_ARCH" >&2
              exit 1
              ;;
          esac

          for pattern in "${expected[@]}"; do
            matches=( $pattern )
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Expected exactly one package matching $pattern, found ${#matches[@]}." >&2
              exit 1
            fi
          done

      - name: Upload ${{ matrix.platform }} packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wormhole-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if release_json="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft,assets 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            existing_assets="$(jq -r '.assets[].name' <<<"$release_json")"

            for asset in dist/*; do
              asset_name="$(basename "$asset")"
              if grep -Fqx "$asset_name" <<<"$existing_assets"; then
                if [[ "$is_draft" == "true" ]]; then
                  gh release upload "$RELEASE_TAG" "$asset" --repo "$REPOSITORY" --clobber
                fi
              else
                gh release upload "$RELEASE_TAG" "$asset" --repo "$REPOSITORY"
              fi
            done

            gh release edit "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --draft=false
          else
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --generate-notes \
              dist/*
          fi
