name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # Both release architectures ship the real OpenVPN3 sidecar.
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Go
        # Go builds both userspace sidecars (wgproxy + ovpnproxy). Pin it explicitly rather
        # than relying on whatever the runner image happens to preinstall.
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/wormhole-ovpnproxy/go.mod
          cache: false

      - name: Set up OpenVPN3 sidecar toolchain (x64)
        # Fetch-OvpnProxy.ps1 builds the real `-tags ovpn3` binary only when a MinGW C++
        # toolchain + CMake are reachable and vcpkg can supply asio/jsoncpp/lz4/xxhash.
        # CMake ships on windows-latest; install MinGW-w64 (gcc/g++/mingw32-make — CGO on
        # Windows uses gcc, NOT MSVC) and point the script at the runner's preinstalled
        # vcpkg via VCPKG_ROOT so it resolves the x64-mingw-static deps from
        # ovpn_shim/vcpkg.json. The script hydrates PATH/VCPKG_ROOT from the registry, so
        # the choco-installed MinGW and this VCPKG_ROOT are picked up by the publish step's
        # child PowerShell even though choco only updates the machine PATH registry.
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up OpenVPN3 sidecar cross-toolchain (arm64)
        if: matrix.platform == 'arm64'
        shell: pwsh
        run: |
          # llvm-mingw's x86_64-hosted archive contains cross compilers for every
          # Windows architecture, including aarch64. Pin the toolchain release so
          # the release build is reproducible.
          $version = "20260602"
          $archive = "$env:RUNNER_TEMP\llvm-mingw.zip"
          $destination = "$env:RUNNER_TEMP\llvm-mingw"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-x86_64.zip"
          $expectedSha256 = "3de3eda9377bbaf35f8c9001f190380f63b8ee981fa55d3ae9d7cce7c6ad7c70"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "llvm-mingw SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $toolchain = Get-ChildItem -LiteralPath $destination -Directory | Select-Object -First 1
          if (-not $toolchain) { throw "llvm-mingw archive did not contain a toolchain directory" }
          $bin = Join-Path $toolchain.FullName "bin"
          if (-not (Test-Path (Join-Path $bin "aarch64-w64-mingw32-clang.exe"))) {
            throw "llvm-mingw archive is missing the aarch64 cross compiler"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WORMHOLE_OVPN_CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:INPUT_TAG
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish (Release / win-${{ matrix.platform }})
        run: >
          dotnet publish Wormhole.csproj
          -c Release
          -r win-${{ matrix.platform }}
          -p:Platform=${{ matrix.platform }}
          -p:RequireRealOvpnProxy=true
          --self-contained true
          -o artifacts/publish/win-${{ matrix.platform }}

      - name: Verify real OpenVPN sidecar shipped
        # Hard gate so we never silently ship the mock-only stub again (the v0.2.4 bug). The
        # stub fatals with "OpenVPN3 binding not linked" on any real-mode connect; the real
        # ovpn3 build instead fails a bogus profile with an OpenVPN parse error. Drive one
        # real-mode config through stdin and assert the stub's signature string is absent.
        shell: pwsh
        run: |
          $platform = "${{ matrix.platform }}"
          $exe = "$PWD\artifacts\publish\win-$platform\wormhole-ovpnproxy.exe"
          if (-not (Test-Path $exe)) {
            throw "wormhole-ovpnproxy.exe is missing from the publish output — Fetch-OvpnProxy.ps1 produced nothing. Check the 'Set up OpenVPN3 sidecar toolchain' step."
          }
          # The mock-only build embeds this fatal string. Byte-scan both architectures
          # because an x64 GitHub runner cannot execute the arm64 binary.
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if ($ascii -match 'binding not linked') {
            throw "Shipped wormhole-ovpnproxy.exe is the MOCK-ONLY stub — the '-tags ovpn3' build did not run."
          }
          if ($platform -eq "x64") {
            $cfg = '{"profile_ovpn":"remote 203.0.113.1 1194\ndev tun\n","mock":false}'
            $out = ($cfg | & $exe 2>&1 | Out-String)
            # The sidecar exits non-zero on the bogus profile; that is expected.
            $global:LASTEXITCODE = 0
            if ($out -match 'binding not linked') {
              throw "Shipped x64 sidecar is mock-only. Sidecar stderr: $out"
            }
          }
          Write-Host "OK: real ovpn3 OpenVPN sidecar verified for $platform."

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $iscc      = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $publish   = "$PWD\artifacts\publish\win-$env:PLATFORM"
          $outputDir = "$PWD\installer\output"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at '$iscc'. Inno Setup 6 install did not land where expected — check the 'Install Inno Setup' step."
          }
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $iscc `
            "/DAppArchitecture=$env:PLATFORM" `
            "/DPublishDir=$publish" `
            "/DMyAppVersion=$env:VERSION" `
            "/O$outputDir" `
            installer\Wormhole.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          # Flatten EXE to workspace root so upload-artifact stores it at the
          # same depth as the zip — otherwise the artifact preserves
          # 'installer/output/' and the release job's glob can't find it.
          Move-Item "$outputDir\Wormhole-*-setup.exe" .

      - name: Generate SHA-256 sidecars
        shell: pwsh
        run: |
          Get-ChildItem "Wormhole-*-setup.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.Name).sha256" -Encoding ascii
          }

      - name: Package zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $zip = "Wormhole-$env:VERSION-win-$env:PLATFORM.zip"
          Compress-Archive -Path "artifacts/publish/win-$env:PLATFORM/*" -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-win-${{ matrix.platform }}
          path: |
            Wormhole-*.zip
            Wormhole-*-setup.exe
            Wormhole-*.sha256
          if-no-files-found: error

  build-electron:
    name: Build Electron ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # The Electron build reuses the same real OpenVPN3 sidecar as the WinUI build.
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/wormhole-ovpnproxy/go.mod
          cache: false

      - name: Set up OpenVPN3 sidecar toolchain (x64)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up OpenVPN3 sidecar cross-toolchain (arm64)
        if: matrix.platform == 'arm64'
        shell: pwsh
        run: |
          $version = "20260602"
          $archive = "$env:RUNNER_TEMP\llvm-mingw.zip"
          $destination = "$env:RUNNER_TEMP\llvm-mingw"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-x86_64.zip"
          $expectedSha256 = "3de3eda9377bbaf35f8c9001f190380f63b8ee981fa55d3ae9d7cce7c6ad7c70"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "llvm-mingw SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $toolchain = Get-ChildItem -LiteralPath $destination -Directory | Select-Object -First 1
          if (-not $toolchain) { throw "llvm-mingw archive did not contain a toolchain directory" }
          $bin = Join-Path $toolchain.FullName "bin"
          if (-not (Test-Path (Join-Path $bin "aarch64-w64-mingw32-clang.exe"))) {
            throw "llvm-mingw archive is missing the aarch64 cross compiler"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WORMHOLE_OVPN_CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:INPUT_TAG
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Electron runtime for ${{ matrix.platform }}
        shell: pwsh
        run: |
          if ("${{ matrix.platform }}" -eq "arm64") {
            $env:npm_config_arch = 'arm64'
            $env:npm_config_platform = 'win32'
          }
          node node_modules/electron/install.js

      - name: Build renderer and Electron main
        run: npm run build:renderer && npm run build:electron

      - name: Build real VPN sidecars
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          & scripts\Build-ElectronVpnSidecars.ps1 -Arch $env:PLATFORM -RequireRealOvpn
          if ($LASTEXITCODE -ne 0) { throw "VPN sidecar build failed with exit $LASTEXITCODE" }

      - name: Build Go backend for ${{ matrix.platform }}
        run: node scripts/Build-ElectronBackend.mjs --arch ${{ matrix.platform }}

      - name: Build native helpers
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          & scripts\Build-CredentialReader.ps1 -Arch $env:PLATFORM
          if ($LASTEXITCODE -ne 0) { throw "Credential reader build failed with exit $LASTEXITCODE" }
          & scripts\Build-RdpHost.ps1 -Arch $env:PLATFORM
          if ($LASTEXITCODE -ne 0) { throw "RDP host build failed with exit $LASTEXITCODE" }

      - name: Verify real OpenVPN sidecar shipped
        shell: pwsh
        run: |
          $platform = "${{ matrix.platform }}"
          $exe = "$PWD\dist-electron\wormhole-ovpnproxy.exe"
          if (-not (Test-Path $exe)) {
            throw "wormhole-ovpnproxy.exe is missing from dist-electron — the sidecar build produced nothing."
          }
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if ($ascii -match 'binding not linked') {
            throw "Shipped wormhole-ovpnproxy.exe is the MOCK-ONLY stub — the '-tags ovpn3' build did not run."
          }
          if ($platform -eq "x64") {
            $cfg = '{"profile_ovpn":"remote 203.0.113.1 1194\ndev tun\n","mock":false}'
            $out = ($cfg | & $exe 2>&1 | Out-String)
            $global:LASTEXITCODE = 0
            if ($out -match 'binding not linked') {
              throw "Shipped x64 sidecar is mock-only. Sidecar stderr: $out"
            }
          }
          Write-Host "OK: real ovpn3 OpenVPN sidecar verified for $platform."

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Electron installer
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          & scripts\Build-ElectronInstaller.ps1 -Architecture $env:PLATFORM -AppVersion $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "Electron installer build failed with exit $LASTEXITCODE" }
          Move-Item "installer\output\Wormhole-*-setup.exe" .

      - name: Generate SHA-256 sidecars
        shell: pwsh
        run: |
          Get-ChildItem "Wormhole-*-setup.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.Name).sha256" -Encoding ascii
          }

      - name: Package zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $zip = "Wormhole-$env:VERSION-electron-win-$env:PLATFORM.zip"
          Compress-Archive -Path "artifacts/electron-app/$env:PLATFORM/Wormhole/*" -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-electron-win-${{ matrix.platform }}
          path: |
            Wormhole-*.zip
            Wormhole-*-setup.exe
            Wormhole-*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, build-electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          printf 'tag=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/Wormhole-*.zip \
            artifacts/Wormhole-*-setup.exe \
            artifacts/Wormhole-*.sha256
