name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:INPUT_TAG
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish (Release / win-${{ matrix.platform }})
        run: >
          dotnet publish Wormhole.csproj
          -c Release
          -r win-${{ matrix.platform }}
          -p:Platform=${{ matrix.platform }}
          --self-contained true
          -o artifacts/publish/win-${{ matrix.platform }}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $iscc      = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $publish   = "$PWD\artifacts\publish\win-$env:PLATFORM"
          $outputDir = "$PWD\installer\output"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at '$iscc'. Inno Setup 6 install did not land where expected — check the 'Install Inno Setup' step."
          }
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $iscc `
            "/DAppArchitecture=$env:PLATFORM" `
            "/DPublishDir=$publish" `
            "/DMyAppVersion=$env:VERSION" `
            "/O$outputDir" `
            installer\Wormhole.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          # Flatten EXE to workspace root so upload-artifact stores it at the
          # same depth as the zip — otherwise the artifact preserves
          # 'installer/output/' and the release job's glob can't find it.
          Move-Item "$outputDir\Wormhole-*-setup.exe" .

      - name: Package zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $zip = "Wormhole-$env:VERSION-win-$env:PLATFORM.zip"
          Compress-Archive -Path "artifacts/publish/win-$env:PLATFORM/*" -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-win-${{ matrix.platform }}
          path: |
            Wormhole-*.zip
            Wormhole-*-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          printf 'tag=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/Wormhole-*.zip \
            artifacts/Wormhole-*-setup.exe
