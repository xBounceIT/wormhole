<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Wormhole terminal</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0c0c0c;
        color: #e0e0e0;
        font-family: "Cascadia Mono", "Consolas", monospace;
        overflow: hidden;
      }
      #terminal {
        width: 100%;
        height: 100%;
        padding: 4px;
        box-sizing: border-box;
      }
      /* Don't force `.xterm { height: 100% }`. The fit addon rounds the row count
         down to whole cells, so the rendered grid is a sub-cell shorter than the
         available height. Stretching .xterm to 100% pulled its absolutely-positioned
         .xterm-viewport (whose xterm.css default background is pure #000, NOT our
         theme background) down past the last row, exposing that gap as a darker
         black strip below the terminal. Letting .xterm size to its content keeps the
         leftover space inside #terminal instead, where it shows #0c0c0c and blends in.
         The viewport background is also pinned to the theme color so any transient
         exposure during a resize re-fit stays invisible rather than flashing #000.
         The selector must match xterm.css's own `.xterm .xterm-viewport` specificity
         (its default is #000) — a bare `.xterm-viewport` rule loses and is ignored. */
      .xterm .xterm-viewport {
        background-color: #0c0c0c;
      }
      .xterm-viewport::-webkit-scrollbar {
        width: 8px;
      }
      .xterm-viewport::-webkit-scrollbar-thumb {
        background: #3a3a3a;
        border-radius: 4px;
      }
    </style>
    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/addon-fit/addon-fit.js"></script>
  </head>
  <body>
    <div id="terminal"></div>
    <script src="bridge.js"></script>
  </body>
</html>
