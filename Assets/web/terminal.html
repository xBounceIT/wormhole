<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Wormhole terminal</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0c0c0c;
        color: #e0e0e0;
        font-family: "Cascadia Mono", "Consolas", monospace;
        overflow: hidden;
      }
      #terminal {
        width: 100%;
        height: 100%;
        padding: 4px;
        box-sizing: border-box;
      }
      .xterm {
        height: 100%;
      }
      .xterm-viewport::-webkit-scrollbar {
        width: 8px;
      }
      .xterm-viewport::-webkit-scrollbar-thumb {
        background: #3a3a3a;
        border-radius: 4px;
      }
    </style>
    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/addon-fit/addon-fit.js"></script>
  </head>
  <body>
    <div id="terminal"></div>
    <script src="bridge.js"></script>
  </body>
</html>
