<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <link rel="stylesheet" href="/src/startup.css" />
    <title>Unlock Bitwarden CLI</title>
  </head>
  <body>
    <main class="startup-shell">
      <section class="startup-card">
        <h1>Unlock Bitwarden CLI</h1>
        <p data-capture-limitation hidden>
          Screen capture protection is unavailable on this platform.
        </p>
        <form class="startup-form">
          <label
            >Bitwarden master password
            <input type="password" autocomplete="off" maxlength="4096" required disabled />
          </label>
          <button type="submit" class="startup-button" disabled>Unlock</button>
          <button type="button" class="startup-button startup-button-secondary">Cancel</button>
          <p role="status" class="startup-status"></p>
        </form>
      </section>
    </main>
    <script type="module" src="/src/vault-bitwarden-cli-unlock.ts"></script>
  </body>
</html>
